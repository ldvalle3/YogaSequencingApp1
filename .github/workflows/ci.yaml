name: Python CI with PostgreSQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          while ! pg_isready -h localhost -U postgres; do
            sleep 1
          done

      - name: Set up database schema
        run: |
          source venv/bin/activate
          python manage.py migrate

     - name: Run unit tests
        run: |
          source venv/bin/activate
          pip install pytest pytest-cov
          pytest --cov=your_module --cov-report=xml --cov-report=html
          
     - name: Bump version and create tag
          id: bump_version
          run: |
            source venv/bin/activate
            bump2version patch  # Change to major or minor as needed
            git push
            git push --tags


      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/

      - name: Lint with flake8
        run: |
          source venv/bin/activate
          pip install flake8
          flake8 .
